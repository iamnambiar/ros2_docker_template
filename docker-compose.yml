services:
  ros2:
    image: ${IMAGE_NAME:-ros2-dev}:${ROS_DISTRO:-rolling}
    build:
      context: .
      args:
        ROS_DISTRO: ${ROS_DISTRO:-rolling}
    volumes:
      - ./src:/ros2_ws/src
      - ./build:/ros2_ws/build
      - ./install:/ros2_ws/install
      - ./log:/ros2_ws/log
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    network_mode: host
    stdin_open: true
    tty: true
