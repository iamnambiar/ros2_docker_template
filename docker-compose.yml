services:
  ros2:
    build:
      context: .
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        USER_UID: ${USER_UID:-1000}
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/home/ros/.Xauthority
      - ROS_DISTRO=${ROS_DISTRO:-jazzy}
    volumes:
      - ../:/ros2_ws:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/home/ros/.Xauthority:ro
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
